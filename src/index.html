    /* Inter alojada en la propia web (variable, 400-700). Va aquí y no en
       styles.scss para que la ruta relativa se resuelva contra <base href>. */

      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,

  <script>
    // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar
    // un parpadeo del tema equivocado.
    (function () {
      var theme = 'light';
      try {
        var stored = localStorage.getItem('theme');
        theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
