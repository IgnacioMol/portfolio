<div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-stage" #stage></div>

  <header class="viewer-top">
    <div>
      <h2 id="viewer-title">{{ t.viewer.title }}</h2>
      @if (supported) {
        <p class="viewer-hint">{{ t.viewer.hint }}</p>
      }
    </div>
    <button #exitButton type="button" class="viewer-exit" (click)="closed.emit()">
      {{ t.viewer.exit }}
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
    </button>
  </header>

  @if (!supported) {
    <p class="viewer-unsupported">{{ t.viewer.unsupported }}</p>
  }

  <aside class="viewer-panel" aria-live="polite">
    @if (active(); as info) {
      <p class="viewer-eyebrow">{{ info.eyebrow }}</p>
      <h3>{{ info.label }}</h3>
      <p class="viewer-description">{{ info.description }}</p>
      <div class="viewer-actions">
        <button type="button" class="btn btn-primary btn-sm" (click)="go(info.navigation)">
          {{ info.action }} <span aria-hidden="true">&rarr;</span>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="select(null)">{{ t.viewer.overview }}</button>
      </div>
    } @else {
      <p class="viewer-description">{{ t.viewer.deskIntro }}</p>
    }
  </aside>
</div>
